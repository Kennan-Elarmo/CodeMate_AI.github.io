<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeMate AI | Sign Up</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body class="auth-page">
  <main class="container page-signup">

    <aside class="overlay">
      <span class="circle circle-top"></span>
      <span class="circle circle-bottom"></span>
      <div class="overlay-content">
        <h2 class="title">Welcome Back !</h2>
        <p class="desc">To keep connected with us please login with your personal info</p>
        <a href="login.html" class="btn btn-light">Login</a>
      </div>
    </aside>

    <section class="form-box" aria-label="Create your account">
      <form id="signUpForm" novalidate>
        <h1 class="title">Create your account</h1>
        <p class="subtitle">It only takes a minute.</p>

        <div class="row">
          <div class="field">
            <label class="label" for="firstName">First name</label>
            <input class="input" type="text" id="firstName" name="firstName" placeholder="Juan" autocomplete="given-name" required />
          </div>
          <div class="field">
            <label class="label" for="lastName">Last name</label>
            <input class="input" type="text" id="lastName" name="lastName" placeholder="Dela Cruz" autocomplete="family-name" required />
          </div>
        </div>

        <div class="field">
          <label class="label" for="email">Email address</label>
          <input class="input" type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required />
        </div>

        <div class="field">
          <label class="label" for="course">Course</label>
          <select class="select" id="course" name="course" required>
            <option value="" selected disabled>Choose...</option>
            <option>Information Technology</option>
            <option>Computer Science</option>
            <option>Information System</option>
            <option>Computer Engineering</option>
          </select>
        </div>

        <div class="row">
          <div class="field">
            <label class="label" for="password">Password</label>
            <input class="input" type="password" id="password" name="password" placeholder="Password" autocomplete="new-password" required />
          </div>
          <div class="field">
            <label class="label" for="confirmPassword">Confirm password</label>
            <input class="input" type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat password" autocomplete="new-password" required />
          </div>
        </div>

        <div class="field">
          <label class="check"><input type="checkbox" id="terms" name="terms" /><span>I agree to the <a href="#">Terms &amp; Conditions</a></span></label>
        </div>

        <button type="submit" class="btn btn-dark btn-block">Create account</button>
      </form>
    </section>

  </main>

  <script src="../assets/js/script.js"></script>
</body>
</html>
